name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: db_penggajian3
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Backend dependencies
        run: cd Backend && npm install

      - name: Install Frontend dependencies
        run: cd Frontend && npm install

      - name: Create Backend .env
        run: |
          echo "APP_PORT=5000" > Backend/.env
          echo "SESS_SECRET=testsecret123" >> Backend/.env
          echo "DB_HOST=127.0.0.1" >> Backend/.env
          echo "DB_USER=root" >> Backend/.env
          echo "DB_PASSWORD=rootpassword" >> Backend/.env
          echo "DB_NAME=db_penggajian3" >> Backend/.env

      - name: Start Backend
        run: cd Backend && npm start &

      - name: Start Frontend
        run: cd Frontend && npm run dev &

      - name: Wait for servers
        run: sleep 30

      - name: Seed admin user
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword db_penggajian3 -e "INSERT INTO data_pegawai (id_pegawai, nik, nama_pegawai, username, password, jenis_kelamin, jabatan, tanggal_masuk, status, photo, url, hak_akses, createdAt, updatedAt) VALUES ('EMP001', '1234567890123456', 'Admin User', 'admin', '\$2b\$10\$wQxJEoS9Q5xKqGDNMEyZr.M0aYRW8PMlTQELJpGqhL6/0JtFGNHAm', 'Laki-laki', 'Admin', '2024-01-01', 'Aktif', 'photo.jpg', 'http://localhost:5000', 'admin', NOW(), NOW());" || true

      - name: Run API tests
        run: node tests/api/salary.test.mjs

      - name: Run E2E tests
        run: npx playwright test --config=playwright.config.mjs

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/