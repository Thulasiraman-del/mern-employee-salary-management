name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: db_penggajian3
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend dependencies
        run: cd Backend && npm install

      - name: Install root dependencies
        run: npm install

      - name: Create Backend .env
        run: |
          echo "APP_PORT=5000" > Backend/.env
          echo "SESS_SECRET=testsecret123" >> Backend/.env
          echo "DB_HOST=127.0.0.1" >> Backend/.env
          echo "DB_USER=root" >> Backend/.env
          echo "DB_PASSWORD=rootpassword" >> Backend/.env
          echo "DB_NAME=db_penggajian3" >> Backend/.env

      - name: Start Backend
        run: cd Backend && npm start &

      - name: Wait for backend
        run: sleep 20

      - name: Run API tests
        run: node tests/api/salary.test.mjs

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: tests/api/